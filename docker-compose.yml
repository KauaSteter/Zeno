services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${SUPABASE_HOST}
      - DB_PORT=5432
      - DB_DATABASE=postgres
      - DB_USERNAME=${SUPABASE_USER}
      - DB_PASSWORD=${SUPABASE_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - APP_URL=http://localhost:8000
      - APP_ENV=production
      - APP_DEBUG=false
    restart: unless-stopped